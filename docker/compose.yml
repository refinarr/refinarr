services:
  refinarr:
    # Build context is the repo root (parent of this docker/ folder)
    # so Dockerfile's `COPY . .` sees src/, package.json, etc.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: refinarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - LOG_LEVEL=info
    volumes:
      - refinarr-data:/data
    ports:
      - "7272:7272"
    restart: unless-stopped

volumes:
  refinarr-data:
