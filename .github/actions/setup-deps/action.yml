name: Setup deps
description: Node 22 + Corepack/yarn + node_modules/Prisma cache + ensure Prisma client

inputs:
  # Composite actions don't have access to the `vars` context, so the
  # caller passes the self-hosted flag through. Used to gate the
  # actions/cache@v4 step (which always pulls from GitHub's cache
  # servers and is slow over residential ISP on self-hosted runners).
  self-hosted:
    description: "true when running on a self-hosted runner"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        # NB: no `cache: yarn` here. setup-node's built-in cache calls
        # `yarn` to resolve the cache dir, which doesn't exist yet on
        # self-hosted runners (myoung34/github-runner ships without
        # yarn — only GitHub-hosted images preinstall it). Corepack
        # below activates yarn first; we cache node_modules directly
        # instead, which makes the yarn-cache-dir cache redundant.

    # Corepack ships with Node 22 but the shims aren't on PATH by
    # default. `enable` adds them; `prepare --activate` pins the yarn
    # version so all runs use the same one.
    - name: Enable Corepack + yarn
      shell: bash
      run: |
        corepack enable
        corepack prepare yarn@1.22.22 --activate

    # Hosted-only cache. actions/cache@v4 always downloads the blob
    # from GitHub's cache servers (it doesn't check local disk first),
    # so on self-hosted the "hit" still pays a 200-300MB pull over the
    # homelab ISP — slower than a fresh `yarn install` from the
    # bind-mounted yarn cache. Skipping the cache step on self-hosted
    # lets the install path below handle both the warm and cold cases.
    - name: Cache node_modules + Prisma client (hosted only)
      if: inputs.self-hosted != 'true'
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          node_modules/.prisma
        key: ${{ runner.os }}-node22-deps-${{ hashFiles('yarn.lock', 'prisma/schema.prisma') }}

    # Always install — idempotent. On hosted-cache-hit it's a fast
    # verify (everything already on disk via the cache step above).
    # On self-hosted it rebuilds node_modules from the bind-mounted
    # yarn cache (~30-60s steady state). Either way ends with a known-
    # good node_modules.
    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile

    # Postinstall runs prisma generate normally, but if yarn install
    # was a no-op (everything already correct on disk) the client
    # might be stale — force a generate to be safe.
    - name: Ensure Prisma client is up to date
      shell: bash
      run: yarn db:generate
