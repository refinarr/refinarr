version: 2
updates:
  # JavaScript dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
    # Group related deps so we get fewer noisy PRs.
    groups:
      types:
        patterns:
          - "@types/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      next:
        patterns:
          - "next"
          - "next-*"
          - "@next/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"
          - "msw"
      eslint-prettier:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
          - "prettier-*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    target-branch: develop
    labels:
      - dependencies
      - github-actions
