name: release-image

# Triggered by release-please when it publishes a GitHub Release after a
# vX.Y.Z tag lands on main. Builds the production Docker image and
# pushes it to GHCR with three tags:
#   - vX.Y.Z (immutable, exact release)
#   - X.Y    (rolling minor — `latest patch in X.Y`)
#   - latest (rolling — most recent release)
#
# GHCR auth uses the workflow's GITHUB_TOKEN (no extra secrets). The
# image inherits repo visibility on first push; flip to public via
# Settings → Packages → refinarr → "Change visibility" if you want
# self-hosters to pull without auth.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
