name: test

# ──────────────────────────────────────────────────────────────────────
# ⚠️  RUNNER CHOICE — controlled by the `RUNNER_LABEL` repository
# variable AND the actor check below.
#
#   To self-hosted:  gh variable set RUNNER_LABEL --body "self-hosted" --repo iHX-Labs/refinarr
#   Back to hosted:  gh variable delete RUNNER_LABEL --repo iHX-Labs/refinarr
#
# ACTOR GATE: only `github.actor == 'iHunterX'` (the maintainer) gets
# routed to RUNNER_LABEL. Everyone else — collaborators, fork PR
# authors, dependabot, etc. — runs on `ubuntu-latest`. Fork code can
# never touch the homelab regardless of RUNNER_LABEL. Safe to keep
# RUNNER_LABEL=self-hosted permanently, even after the repo is public.
# ──────────────────────────────────────────────────────────────────────

# Triggers do NOT use `paths-ignore`. A workflow skipped by a path filter
# leaves its required checks ("lint + tsc + vitest", "playwright") stuck
# Pending forever, so a docs-only PR can never satisfy the branch ruleset
# and is unmergeable. Instead the `changes` job below classifies the diff
# and the heavy jobs gate on it via `if:` — a job skipped by a conditional
# reports Success, which DOES satisfy a required check. So docs-only PRs go
# green instantly with zero heavy CI, mixed code+docs PRs run the real
# suite, and there's no second "no-op" workflow that could shadow a real
# failing check. (GitHub docs: "Troubleshooting required status checks".)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the PR/push diff into "code changed" vs "docs-only". Always
  # runs (never required), and its output gates the two required jobs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the PR merge-base resolves for the diff below.
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
            files="$(git diff --name-only "$base" HEAD)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$SHA")"
          else
            # New branch / unknown base (force-push, first push): can't diff
            # reliably, so run the full suite rather than risk skipping it.
            files=""
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Unknown base — defaulting to code=true"; exit 0
          fi
          echo "Changed files:"; printf '%s\n' "$files"
          # Doc-inert paths (mirrors the former paths-ignore list). A file
          # outside these counts as code and triggers the full suite.
          # messages/** is deliberately NOT inert: `yarn lint` prettier-checks
          # messages/*.json and the app imports messages/en.json at runtime,
          # so a message-only change must run CI.
          if printf '%s\n' "$files" | grep -qvE '(\.md$|^plans/|^\.vscode/|^$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: lint + tsc + vitest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ github.actor == 'iHunterX' && (vars.RUNNER_LABEL || 'ubuntu-latest') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-deps

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn tsc --noEmit

      - name: Unit + integration tests (with coverage)
        run: yarn test:coverage

      # Catches RSC boundary violations that lint and tsc don't see
      # (e.g. importing a "use client" component into a Server Component
      # tree, or a server-only module reaching a client bundle). The
      # dev-checklist requires running this locally too; CI is the
      # safety net. PR-only: the post-merge push run skips it since the
      # identical tree was already built on the PR that gated the merge.
      - name: Production build
        if: github.event_name == 'pull_request'
        run: yarn build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: playwright
    needs: changes
    runs-on: ${{ github.actor == 'iHunterX' && (vars.RUNNER_LABEL || 'ubuntu-latest') || 'ubuntu-latest' }}
    timeout-minutes: 15
    # PR-only: e2e gates the merge, so it runs on PRs (skipping drafts to
    # save minutes during in-flight iteration; it picks up when the PR is
    # marked ready_for_review). The post-merge push to main skips e2e —
    # the same tree already passed it on the PR — keeping main's CI a fast
    # lint + tsc + vitest health signal. Also skipped on docs-only PRs
    # (changes.code == 'false') — a conditional-skip reports Success, so the
    # required "playwright" check is satisfied without running the suite.
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-deps

      # actions/cache for Playwright browsers — runs on every runner.
      # Self-hosted resolves to the homelab falcondev cache server;
      # hosted to GitHub's cache service.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json', 'yarn.lock') }}

      # Always run install — idempotent: ~1-2s no-op when browsers
      # already exist (self-hosted bind mount, or hosted cache hit
      # above), ~30s download otherwise. Single step means no
      # half-installed state regardless of runner type.
      - name: Install Playwright browsers + OS deps
        run: yarn playwright install --with-deps chromium

      - name: Run E2E tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
