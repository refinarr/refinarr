name: docker-pr-build

# PR-only smoke check — builds the Docker image (single-arch,
# no push) to catch Dockerfile breakage BEFORE it lands on develop.
# Failed release-image builds for v0.1.1, v0.1.2, v0.2.0, and
# v0.2.1 (all the prisma-schema-missing breakage) would have been
# caught by this check in the source PR.
#
# amd64-only by default — same Dockerfile bugs hit both arches,
# and amd64 finishes in ~5 min vs arm64's ~7. Adding arm64
# doubles PR feedback time for marginal value. Multi-arch is
# already covered on the release path.
#
# Path-gated so the workflow only fires when something that
# could break the build changed (Dockerfile, deps, prisma
# schema, this workflow itself). Skipped otherwise.

on:
  pull_request:
    branches: [develop]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "yarn.lock"
      - "prisma/**"
      - ".github/workflows/docker-pr-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=pr-amd64
          cache-to: type=gha,mode=max,scope=pr-amd64
