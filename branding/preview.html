<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Refinarr — accent options</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 48px 32px; background: #0a0a0a; color: #e5e7eb;
         font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0 0 32px; color: #9ca3af; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 16px; max-width: 1400px; }
  .card { background: #111113; border: 1px solid #1f1f23; border-radius: 12px;
          padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .lockup { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 18px; font-weight: 700; letter-spacing: -.02em; color: #f3f4f6; }
  .wordmark .arr { opacity: .55; }
  .meta { font-size: 12px; color: #9ca3af; display: flex; justify-content: space-between; align-items: center; }
  .meta code { background: #18181b; padding: 2px 6px; border-radius: 4px; font-size: 11px;
               color: #d4d4d8; font-family: ui-monospace, "SF Mono", monospace; }
  .swatches { display: flex; gap: 6px; }
  .swatches span { width: 18px; height: 18px; border-radius: 4px; }
  .name { font-weight: 600; color: #f3f4f6; font-size: 13px; }
  .icon-frame { display: flex; gap: 8px; align-items: center; }
  .icon-16, .icon-32, .icon-64 { display: block; }
  .preview-bg { background: #0f0f10; padding: 16px; border-radius: 8px; border: 1px solid #1f1f23; }
  hr { border: 0; border-top: 1px solid #1f1f23; margin: 0; }
</style>
</head>
